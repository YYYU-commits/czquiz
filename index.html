<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F5EFE0">
<title>重走长征路 · 知识竞答</title>
<style>
  :root{
    --red:#8B1A1A;
    --red-2:#A93226;
    --bg:#F5EFE0;
    --card:#FFFBF2;
    --text:#2B2B2B;
    --muted:#7A6E63;
    --line:#E2D6C0;
    --ok:#2E7D32;
    --bad:#C0392B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    -webkit-text-size-adjust:100%;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    padding:28px 20px 36px;
    display:flex;
    flex-direction:column;
  }

  /* ---------- 通用屏幕 ---------- */
  .screen{display:none;flex:1;flex-direction:column;animation:fade .22s ease both;}
  .screen.active{display:flex;}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .eyebrow{font-size:13px;color:var(--muted);letter-spacing:1px;margin:0 0 18px;}
  .meta{font-size:14px;color:var(--muted);margin:0 0 6px;}
  .meta.small{font-size:12.5px;}

  .btn{
    display:block;width:100%;padding:16px;border:none;border-radius:12px;
    background:var(--red);color:#fff;font-size:17px;font-weight:600;
    font-family:inherit;letter-spacing:1px;cursor:pointer;
    transition:background .15s,opacity .15s;
  }
  .btn:active{background:var(--red-2);}
  .btn.ghost{background:transparent;color:var(--red);border:1.5px solid var(--red);}
  .btn.ghost:active{background:#F3E7E4;}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn:disabled:active{background:var(--red);}
  .btn.ghost:disabled:active{background:transparent;}

  /* ---------- 第一屏：封面 ---------- */
  #s-cover{justify-content:center;text-align:center;}
  .cover-card{padding:8px 0 34px;}
  .title{font-size:40px;line-height:1.2;color:var(--red);margin:0;letter-spacing:5px;font-weight:700;}
  .rule{width:44px;height:3px;background:var(--red);margin:20px auto;border-radius:2px;}
  .subtitle{font-size:19px;margin:0 0 14px;letter-spacing:2px;color:#3A3330;}

  /* ---------- 第二屏：答题 ---------- */
  .quiz-top{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted);margin-bottom:10px;}
  .qbar{height:4px;background:#E7DBC6;border-radius:2px;overflow:hidden;margin-bottom:26px;}
  .qbar-fill{height:100%;width:0;background:var(--red);border-radius:2px;transition:width .25s;}
  .qtext{font-size:19px;line-height:1.55;margin:0 0 22px;font-weight:600;color:#241F1C;}
  .options{display:flex;flex-direction:column;gap:11px;margin-bottom:26px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;
    padding:15px 14px;font-size:16.5px;line-height:1.45;color:var(--text);
    font-family:inherit;cursor:pointer;
    transition:border-color .15s,background .15s;
  }
  .option .tag{
    flex:none;width:24px;height:24px;border-radius:50%;background:#EFE3CC;
    color:#8A7A64;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;margin-top:1px;
  }
  .option.selected{border-color:var(--red);background:#FBF0EE;}
  .option.selected .tag{background:var(--red);color:#fff;}

  .nav{display:flex;gap:12px;margin-top:auto;}
  .nav .btn{flex:1;}
  .nav.col{flex-direction:column;}

  /* ---------- 第三屏：成绩 ---------- */
  #s-result{justify-content:center;text-align:center;}
  .result-card{padding:10px 0 40px;}
  .score{font-size:74px;font-weight:700;color:var(--red);line-height:1;}
  .score small{font-size:22px;font-weight:600;margin-left:4px;}
  .score-sub{font-size:15px;color:var(--muted);margin:18px 0 0;}
  .score-tip{font-size:14px;color:var(--muted);margin:28px 0 0;letter-spacing:1px;}

  /* ---------- 第四屏：回顾 ---------- */
  .review-head h2{font-size:22px;color:var(--red);margin:0 0 6px;letter-spacing:1px;}
  .review-list{display:flex;flex-direction:column;gap:14px;margin:20px 0 26px;}
  .ritem{background:var(--card);border:1.5px solid var(--line);border-left-width:4px;border-radius:10px;padding:14px;}
  .ritem.ok{border-left-color:var(--ok);}
  .ritem.no{border-left-color:var(--bad);}
  .rhead{font-size:12.5px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;}
  .rmark{font-weight:700;}
  .rmark.ok{color:var(--ok);}
  .rmark.no{color:var(--bad);}
  .rq{font-size:15.5px;line-height:1.5;margin:0 0 10px;font-weight:600;}
  .ra{font-size:14px;line-height:1.6;margin:0 0 4px;color:#4A423B;}
  .ra.mine{color:var(--muted);}
  .rexp{font-size:13.5px;line-height:1.65;color:var(--muted);margin:8px 0 0;padding-top:8px;border-top:1px dashed var(--line);}
</style>
</head>
<body>
<main id="app">

  <!-- ========== 第一屏：封面 ========== -->
  <section class="screen active" id="s-cover">
    <div class="cover-card">
      <p class="eyebrow">2024级大数据2班 · 主题团日活动</p>
      <h1 class="title">重走长征路</h1>
      <div class="rule"></div>
      <p class="subtitle">长征知识竞答</p>
      <p class="meta" id="coverDate"></p>
      <p class="meta small">共 15 题 · 题库 30 道随机抽取</p>
    </div>
    <button class="btn" id="btnStart">开始答题</button>
  </section>

  <!-- ========== 第二屏：答题 ========== -->
  <section class="screen" id="s-quiz">

      <span id="qIndex">第 1 / 15 题</span>

    <div class="options" id="options"></div>
    <div class="nav">
      <button class="btn ghost" id="btnPrev">上一题</button>
      <button class="btn" id="btnNext">下一题</button>
    </div>
  </section>

  <!-- ========== 第三屏：成绩 ========== -->
  <section class="screen" id="s-result">
    <div class="result-card">
      <p class="eyebrow">答题完成</p>
      <div class="score"><span id="scoreNum">0</span><small>分</small></div>
      <p class="score-sub" id="scoreSub"></p>
      <p class="score-tip">长征精神，永远在路上。</p>
    </div>
    <div class="nav col">
      <button class="btn" id="btnReview">查看答题回顾</button>
      <button class="btn ghost" id="btnAgain1">再来一次</button>

  </section>

  <!-- ========== 第四屏：回顾 ========== -->
  <section class="screen" id="s-review">
    <div class="review-head">
      <h2>答题回顾</h2>
      <p class="meta" id="reviewSum"></p>
    </div>
    <div class="review-list" id="reviewList"></div>
    <button class="btn" id="btnAgain2">再来一次</button>
  </section>

</main>

<script>

/* =========================================================
   配置
   ========================================================= */
const QUIZ_LEN = 15;               // 每场抽取的题目数量
const STORE_KEY = 'cz_quiz_v1';    // 本机保存进度的键名（不上传任何数据）

const LETTERS = ['A','B','C','D'];
const $ = id => document.getElementById(id);

/* =========================================================
   状态
   ========================================================= */
let state = null;

/* 洗牌：Fisher-Yates，保证抽题不重复 */
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* 新建一场：从题库随机抽 QUIZ_LEN 道 */
function newState(){
  const ids = shuffle(BANK.map((_, i) => i)).slice(0, QUIZ_LEN);
  return { ids: ids, answers: new Array(QUIZ_LEN).fill(-1), idx: 0, submitted: false };
}

function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(STORE_KEY));
    if(s && Array.isArray(s.ids) && s.ids.length === QUIZ_LEN &&
       Array.isArray(s.answers) && s.answers.length === QUIZ_LEN){
      return s;
    }
  }catch(e){}
  return null;
}

/* =========================================================
   切屏
   ========================================================= */
function show(id){
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo(0, 0);
}

/* =========================================================
   封面
   ========================================================= */
function renderCover(){
  const d = new Date();
  $('coverDate').textContent = d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  const answered = state.answers.filter(a => a >= 0).length;
  $('btnStart').textContent = answered > 0 ? '继续答题' : '开始答题';
  show('s-cover');
}

/* =========================================================
   答题
   ========================================================= */
function renderQuiz(){
  const q = BANK[state.ids[state.idx]];

  $('qIndex').textContent = '第 ' + (state.idx + 1) + ' / ' + QUIZ_LEN + ' 题';
  $('qAnswered').textContent = '已答 ' + state.answers.filter(a => a >= 0).length + ' 题';
  $('qbarFill').style.width = (state.idx / QUIZ_LEN * 100) + '%';
  $('qtext').textContent = q.q;

  const box = $('options');
  box.innerHTML = '';
  q.o.forEach((text, i) => {
    const b = document.createElement('button');
    b.className = 'option' + (state.answers[state.idx] === i ? ' selected' : '');
    b.innerHTML = '<span class="tag"></span><span class="otxt"></span>';
    b.querySelector('.tag').textContent = LETTERS[i];
    b.querySelector('.otxt').textContent = text;
    b.addEventListener('click', () => {
      state.answers[state.idx] = i;
      save();
      renderQuiz();
    });
    box.appendChild(b);
  });

  $('btnPrev').disabled = (state.idx === 0);

  const isLast = (state.idx === QUIZ_LEN - 1);
  $('btnNext').textContent = isLast ? '提交并查看成绩' : '下一题';
  $('btnNext').disabled = (state.answers[state.idx] < 0);

  window.scrollTo(0, 0);
}

/* =========================================================
   成绩
   ========================================================= */
function countCorrect(){
  let n = 0;
  state.ids.forEach((bankId, i) => {
    if(state.answers[i] === BANK[bankId].a) n++;
  });
  return n;
}

function renderResult(){
  const correct = countCorrect();
  const score = Math.round(correct / QUIZ_LEN * 100);
  $('scoreNum').textContent = score;
  $('scoreSub').textContent = '答对 ' + correct + ' / ' + QUIZ_LEN + ' 题';
  show('s-result');
}

/* =========================================================
   回顾
   ========================================================= */
function renderReview(){
  const correct = countCorrect();
  $('reviewSum').textContent = '答对 ' + correct + ' / ' + QUIZ_LEN +
    ' 题 · 得分 ' + Math.round(correct / QUIZ_LEN * 100) + ' 分';

  const list = $('reviewList');
  list.innerHTML = '';

  state.ids.forEach((bankId, i) => {
    const q = BANK[bankId];
    const mine = state.answers[i];
    const ok = (mine === q.a);

    const item = document.createElement('div');
    item.className = 'ritem ' + (ok ? 'ok' : 'no');

    const mineText = mine >= 0
      ? LETTERS[mine] + '. ' + q.o[mine]
      : '未作答';

    let html = '';
    html += '<div class="rhead"><span>第 ' + (i + 1) + ' 题</span>';
    html += '<span class="rmark ' + (ok ? 'ok' : 'no') + '">' + (ok ? '✓ 正确' : '✗ 错误') + '</span></div>';
    html += '<p class="rq"></p>';
    html += '<p class="ra mine">你的答案：' + mineText + '</p>';
    if(!ok){
      html += '<p class="ra">正确答案：' + LETTERS[q.a] + '. ' + q.o[q.a] + '</p>';
    }
    html += '<p class="rexp"></p>';

    item.innerHTML = html;
    item.querySelector('.rq').textContent = q.q;
    item.querySelector('.rexp').textContent = '解析：' + q.e;
    list.appendChild(item);
  });

  show('s-review');
}

/* =========================================================
   提交 / 重来
   ========================================================= */
function submit(){
  state.submitted = true;
  save();
  renderResult();
}

function restart(){
  state = newState();
  save();
  renderCover();
}

/* =========================================================
   事件绑定
   ========================================================= */
$('btnStart').addEventListener('click', () => {
  show('s-quiz');
  renderQuiz();
});

$('btnPrev').addEventListener('click', () => {
  if(state.idx > 0){
    state.idx--;
    save();
    renderQuiz();
  }
});

$('btnNext').addEventListener('click', () => {
  if(state.answers[state.idx] < 0) return;   // 没选不允许前进
  if(state.idx === QUIZ_LEN - 1){
    submit();
  }else{
    state.idx++;
    save();
    renderQuiz();
  }
});

$('btnReview').addEventListener('click', renderReview);
$('btnAgain1').addEventListener('click', restart);
$('btnAgain2').addEventListener('click', restart);

/* =========================================================
   启动
   ========================================================= */
(function init(){
  const saved = load();
  if(saved){
    state = saved;
    if(state.submitted){
      renderResult();               // 已经交过卷，直接看成绩
    }else if(state.answers.some(a => a >= 0)){
      renderCover();                // 答到一半刷新过，从封面点“继续答题”
    }else{
      renderCover();                // 只是打开过，还没答
    }
  }else{
    state = newState();
    save();
    renderCover();
  }
})();
</script>
</body>
</html>
